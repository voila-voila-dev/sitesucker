[package]
name = "sitegrabber"
version = "2.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["default-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
scraper = "0.22"
url = "2"
indicatif = "0.17"
console = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
chrono = "0.4"
futures = "0.3"
quick-xml = "0.37"
